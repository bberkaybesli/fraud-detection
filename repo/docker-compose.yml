version: '3.8'

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: fraud-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["graph-data-science","apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./init-neo.cypher:/var/lib/neo4j/import/init-neo.cypher
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - fraud-network

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    command: redis-server --notify-keyspace-events Ex --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fraud-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraud-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MASAK_MOCK_URL=http://masak-mock:4000
      - LOG_LEVEL=info
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
    networks:
      - fraud-network
    restart: unless-stopped
  # masak-mock:
  #   build:
  #     context: ./masak-mock
  #     dockerfile: Dockerfile
  #   container_name: fraud-masak-mock
  #   ports:
  #     - "4000:4000"
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=4000
  #     - LOG_LEVEL=info
  #   volumes:
  #     - ./masak-mock/src:/app/src
  #     - ./masak-mock/reports:/app/reports
  #   networks:
  #     - fraud-network
  #   restart: unless-stopped

volumes:
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  redis-data:
    driver: local

networks:
  fraud-network:
    driver: bridge
